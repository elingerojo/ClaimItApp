<!-- Estado de sesión admin: formulario de login o indicador de sesión activa -->
@if (adminTokenService.authenticated()) {
  <div class="flex items-center gap-2 text-xs">
    <span class="flex items-center gap-1.5 font-medium text-green-600">
      <span class="w-2 h-2 rounded-full bg-green-500"></span>
      Sesión activa
    </span>
    <button
      (click)="onLogout()"
      title="Cerrar sesión de este dispositivo. Deberás ingresar el password de nuevo."
      class="text-[10px] text-red-500 hover:underline font-medium">
      Cerrar Sesión
    </button>
  </div>
} @else {
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
    <input
      type="password"
      [(ngModel)]="password"
      (keydown.enter)="onLogin()"
      placeholder="Password de administrador"
      title="Ingresa el password del administrador para autenticarte en este dispositivo."
      class="text-xs px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400 font-mono w-64 shadow-sm transition-all duration-300"
    />
    <button
      (click)="onLogin()"
      [disabled]="adminTokenService.isLoggingIn()"
      title="Autenticarte con el password del administrador"
      class="text-xs bg-gray-900 text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-800 transition-colors disabled:opacity-50">
      {{ adminTokenService.isLoggingIn() ? 'Autenticando...' : 'Iniciar Sesión' }}
    </button>
  </div>
}
