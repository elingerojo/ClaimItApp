<div class="text-center">
  <div class="mx-auto w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mb-4">
    <span class="text-2xl">🤔</span>
  </div>
  <h3 class="text-lg font-bold text-gray-900 mb-1">Ese apodo ya está en uso</h3>
  <p class="text-sm text-gray-600">
    ¿Es la primera vez que usas
    <strong class="font-mono text-gray-900">&#64;{{ alias }}</strong>?
  </p>
</div>

@if (showWebviewHint) {
  <div class="mt-4 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs px-3 py-2">
    Detectamos que abriste este enlace dentro de otra app. Si ya habías entrado
    antes, tu identidad pudo crearse por separado: elige «No, ese apodo es mío».
  </div>
}

<div class="mt-5 space-y-3" role="radiogroup" aria-label="¿Es la primera vez que usas este apodo?">
  <button
    id="invite-recovery-new"
    type="button"
    role="radio"
    [attr.aria-checked]="selected() === 'new'"
    (click)="select('new')"
    [class]="cardClass('new')"
  >
    <span class="flex items-start justify-between gap-2">
      <span class="text-sm font-semibold text-gray-900">
        Sí, es mi primera vez con &#64;{{ alias }}
      </span>
      @if (isEmphasized('new')) {
        <span class="shrink-0 text-[10px] font-bold bg-gray-900 text-white rounded-full px-2 py-0.5">
          ✓ Recomendado
        </span>
      }
    </span>
    <span class="block text-xs text-gray-500 mt-1">
      Ese apodo ya lo ocupa otra persona. Elige otro; te sugeriremos
      &#64;{{ alias }}-tocayo-2.
    </span>
  </button>

  <button
    id="invite-recovery-existing"
    type="button"
    role="radio"
    [attr.aria-checked]="selected() === 'existing'"
    (click)="select('existing')"
    [class]="cardClass('existing')"
  >
    <span class="flex items-start justify-between gap-2">
      <span class="text-sm font-semibold text-gray-900">No, ese apodo es mío</span>
      @if (isEmphasized('existing')) {
        <span class="shrink-0 text-[10px] font-bold bg-gray-900 text-white rounded-full px-2 py-0.5">
          ✓ Recomendado
        </span>
      }
    </span>
    <span class="block text-xs text-gray-500 mt-1">
      Ya había estado navegando antes; quiero continuar con mi lista y mis apartados.
    </span>
  </button>
</div>

<button
  type="button"
  (click)="confirm()"
  class="mt-5 w-full text-sm bg-gray-900 text-white px-4 py-3 rounded-xl font-medium hover:bg-gray-800 transition-colors"
>
  Continuar
</button>
