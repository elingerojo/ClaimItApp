<div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm max-h-[500px] lg:max-h-full overflow-y-auto">
  <h3 class="text-sm font-semibold tracking-wider text-gray-400 uppercase mb-4">{{ 'Actividad Anotaciones en Vivo' | stripAccents }}</h3>
  
  <div class="space-y-4">
    @for (log of activityLogs(); track log.claimed_at) {
      <div class="text-xs text-gray-600 border-b border-gray-50 pb-3 last:border-0 last:pb-0">
        <span class="font-medium text-gray-900 font-mono">&#64;{{ log.username }}</span> 
        claimed 
        <span class="italic text-gray-800 font-medium">"{{ log.title }}"</span>
        <div class="flex items-center space-x-2 mt-1 text-[10px] text-gray-400">
          <span class="px-1.5 py-0.5 bg-gray-50 rounded text-gray-500 font-medium">{{ log.category }}</span>
          <span>•</span>
          <span>{{ log.claimed_at | date:'shortTime' }}</span>
        </div>
      </div>
    } @empty {
      <div class="text-xs text-gray-400 italic text-center py-4">No hay anotacione en este momento todavía.</div>
    }
  </div>
</div>
